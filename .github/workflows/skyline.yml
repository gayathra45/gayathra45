# ONE FILE SETUP — save as  .github/workflows/skyline.yml  in your profile repo (gayathra45/gayathra45)
# Then: Actions tab -> "Skyline" -> Run workflow. It commits skyline.svg to the repo root.
# In README.md, replace the snake block with:
#   <div align="center"><img src="./skyline.svg" alt="Contribution Skyline" width="100%" /></div>
# Optional: add a secret GH_PAT (PAT with read:user) to include private contributions.
name: Skyline

on:
  push:
    paths:
      - ".github/workflows/skyline.yml"
      - "scripts/**"
  schedule:
    - cron: "0 */4 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  skyline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/github-script@v7
        with:
          github-token: ${{ github.token }}
          script: |
            const fs = require("fs");
            const USER = context.repo.owner;
            const PALETTE = ["#ebedf0", "#9be9a8", "#40c463", "#30a14e", "#216e39"];
            const FONT = "'Fira Code',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace";

            const mix = (hex, to, t) => {
              const n = parseInt(hex.slice(1), 16);
              return "#" + [n >> 16, (n >> 8) & 255, n & 255]
                .map((c) => Math.round(c + (to - c) * t).toString(16).padStart(2, "0")).join("");
            };
            const topC = (c) => mix(c, 255, 0.35);
            const sideC = (c) => mix(c, 0, 0.22);

            const res = await github.graphql(
              `query($u:String!){user(login:$u){contributionsCollection{contributionCalendar{weeks{contributionDays{date contributionCount weekday}}}}}}`,
              { u: USER }
            );
            const weeks = res.user.contributionsCollection.contributionCalendar.weeks.map((w) => w.contributionDays);

            const CW = 14, BW = 11, OX = 5, OY = 4, MAX_H = 140, MIN_H = 2, LEFT = 16, BASE = 262, H = 310;
            const W = LEFT * 2 + weeks.length * CW + 6 * OX;
            const all = weeks.flat();
            const max = Math.max(1, ...all.map((d) => d.contributionCount));
            const best = all.reduce((a, b) => (b.contributionCount > a.contributionCount ? b : a), all[0]);
            const k = MAX_H / Math.sqrt(max); // height = sqrt(count)

            const nz = all.map((d) => d.contributionCount).filter(Boolean).sort((a, b) => a - b);
            const q = (p) => nz[Math.min(nz.length - 1, Math.floor(p * nz.length))] || 1;
            const cuts = [q(0.25), q(0.5), q(0.75)];
            const level = (c) => (c === 0 ? 0 : c <= cuts[0] ? 1 : c <= cuts[1] ? 2 : c <= cuts[2] ? 3 : 4);

            const boxes = [];
            weeks.forEach((days, wi) => days.forEach((d) => boxes.push({ ...d, wi, depth: 6 - d.weekday })));
            boxes.sort((a, b) => b.depth - a.depth || a.wi - b.wi); // back to front

            const RISE = 0.7, ROW = 0.16, LAG = 0.006; // wave: front row first, then back
            const leaderAt = (6 * ROW + (weeks.length - 1) * LAG + RISE + 0.15).toFixed(2);

            let shapes = "", pos = null;
            const exportBoxes = [];
            for (let idx = 0; idx < boxes.length; idx++) {
              const b = boxes[idx];
              const h = b.contributionCount === 0 ? MIN_H : Math.max(MIN_H + 1, Math.sqrt(b.contributionCount) * k);
              const x = LEFT + b.wi * CW + b.depth * OX, y = BASE - b.depth * OY;
              const lv = level(b.contributionCount);
              const delay = (b.depth * ROW + b.wi * LAG).toFixed(3);
              if (b.date === best.date) pos = { x: x + BW / 2 + OX / 2, y: y - h - OY };
              shapes +=
                `<g transform="translate(${x} ${y})"><g class="b" style="animation-delay:${delay}s">` +
                `<polygon class="l${lv} f" points="0,${-h} ${BW},${-h} ${BW},0 0,0"/>` +
                `<polygon class="l${lv} t" points="0,${-h} ${BW},${-h} ${BW + OX},${-h - OY} ${OX},${-h - OY}"/>` +
                `<polygon class="l${lv} s" points="${BW},${-h} ${BW + OX},${-h - OY} ${BW + OX},${-OY} ${BW},0"/>` +
                `<title>${b.date}: ${b.contributionCount}</title></g></g>`;
              exportBoxes.push({
                idx: idx,
                x: x,
                y: y,
                lv: lv,
                h: Number(h.toFixed(1)),
                date: b.date,
                count: b.contributionCount
              });
            }

            const date = new Date(best.date + "T00:00:00Z").toLocaleDateString("en-US", { month: "short", day: "numeric", year: "numeric", timeZone: "UTC" });
            const label = `Best day · ${best.contributionCount} · ${date}`;
            const topY = 30, goLeft = pos.x + 30 + label.length * 16 > W;
            const hx = goLeft ? pos.x - 22 : pos.x + 22;
            const len = Math.round(pos.y - topY + 32);
            shapes +=
              `<g class="leader" style="animation-delay:${leaderAt}s"><circle cx="${pos.x}" cy="${pos.y}" r="3.5"/>` +
              `<path d="M${pos.x} ${pos.y} V${topY} L${hx} ${topY}" style="stroke-dasharray:${len + 4};stroke-dashoffset:${len + 4};animation-delay:${leaderAt}s"/>` +
              `<text x="${goLeft ? hx - 6 : hx + 6}" y="${topY + 5}" text-anchor="${goLeft ? "end" : "start"}">${label}</text></g>`;

            const total = all.reduce((a, d) => a + d.contributionCount, 0);
            const lvCss = PALETTE.map((c, i) => `.l${i}.f{fill:${c}}.l${i}.t{fill:${topC(c)}}.l${i}.s{fill:${sideC(c)}}`).join("");

            const svg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${W} ${H}" role="img" aria-label="GitHub contribution skyline: ${total} contributions in the last year">
            <style>
            :root{--txt:#24292f}
            @media (prefers-color-scheme:dark){:root{--txt:#e6edf3}}
            text{font-family:${FONT};font-size:15px;fill:var(--txt)}
            @media (max-width:620px){text{font-size:26px}}
            ${lvCss}
            .b{transform:scaleY(0);transform-origin:0 0;animation:rise ${RISE}s cubic-bezier(.2,.8,.2,1) forwards}
            @keyframes rise{to{transform:scaleY(1)}}
            .leader{opacity:0;animation:fade .4s ease forwards}
            .leader circle{fill:#ff5d73}
            .leader path{fill:none;stroke:#ff5d73;stroke-width:1.6;animation:draw .7s ease forwards}
            .leader text{font-weight:600}
            .foot{opacity:.7}
            @keyframes fade{to{opacity:1}}@keyframes draw{to{stroke-dashoffset:0}}
            @media (prefers-reduced-motion:reduce){.b{transform:none;animation:none}.leader,.leader path{opacity:1;stroke-dashoffset:0;animation:none}}
            </style>
            ${shapes}
            </svg>`;
            fs.writeFileSync("skyline.svg", svg);
            fs.mkdirSync("scripts", { recursive: true });
            fs.writeFileSync("scripts/skyline_data.json", JSON.stringify(exportBoxes, null, 2));

            // Auto-update github_stats.svg and footer.svg with 100% live real-time telemetry
            try {
              const https = require("https");
              const statsRes = await github.graphql(
                `query($u:String!){
                  user(login:$u){
                    contributionsCollection {
                      totalCommitContributions
                      restrictedContributionsCount
                      contributionCalendar { totalContributions }
                    }
                    y2022: contributionsCollection(from: "2022-01-01T00:00:00Z", to: "2022-12-31T23:59:59Z") { contributionCalendar { totalContributions } }
                    y2023: contributionsCollection(from: "2023-01-01T00:00:00Z", to: "2023-12-31T23:59:59Z") { contributionCalendar { totalContributions } }
                    y2024: contributionsCollection(from: "2024-01-01T00:00:00Z", to: "2024-12-31T23:59:59Z") { contributionCalendar { totalContributions } }
                    y2025: contributionsCollection(from: "2025-01-01T00:00:00Z", to: "2025-12-31T23:59:59Z") { contributionCalendar { totalContributions } }
                    y2026: contributionsCollection(from: "2026-01-01T00:00:00Z", to: "2026-12-31T23:59:59Z") { contributionCalendar { totalContributions } }
                    pullRequests(first: 1) { totalCount }
                    issues(first: 1) { totalCount }
                    repositoriesContributedTo(first: 1, contributionTypes: [COMMIT, ISSUE, PULL_REQUEST, REPOSITORY]) { totalCount }
                    repositories(first: 100, ownerAffiliations: OWNER, isFork: false) {
                      nodes {
                        stargazerCount
                        languages(first: 10, orderBy: {field: SIZE, direction: DESC}) {
                          edges { size node { name color } }
                        }
                      }
                    }
                  }
                }`,
                { u: USER }
              );
              const u = statsRes.user;
              const commitsYear = Math.max(
                (u.contributionsCollection.totalCommitContributions || 0) + (u.contributionsCollection.restrictedContributionsCount || 0),
                u.y2026?.contributionCalendar?.totalContributions || 0,
                total
              );
              const allTimeTotal =
                (u.y2022?.contributionCalendar?.totalContributions || 0) +
                (u.y2023?.contributionCalendar?.totalContributions || 0) +
                (u.y2024?.contributionCalendar?.totalContributions || 0) +
                (u.y2025?.contributionCalendar?.totalContributions || 0) +
                commitsYear;

              const prs = u.pullRequests.totalCount;
              const issues = u.issues.totalCount;
              const contributed = u.repositoriesContributedTo.totalCount;
              const stars = u.repositories.nodes.reduce((acc, r) => acc + (r.stargazerCount || 0), 0);

              // Dynamic Rank Calculation
              const score = commitsYear * 1.0 + prs * 15 + stars * 20 + issues * 5 + contributed * 10;
              const rankLetter = score >= 2500 ? "S" : score >= 1800 ? "A+" : score >= 1400 ? "A-" : score >= 900 ? "B+" : "B";

              // Calculate current streak and longest streak from calendar days
              let curStreak = 0, maxStreak = 0;
              let maxStart = null, maxEnd = null, tempStart = null;
              for (const d of all) {
                if (d.contributionCount > 0) {
                  if (curStreak === 0) tempStart = d.date;
                  curStreak++;
                  if (curStreak > maxStreak) {
                    maxStreak = curStreak;
                    maxStart = tempStart;
                    maxEnd = d.date;
                  }
                } else {
                  curStreak = 0;
                }
              }
              let activeStreak = 0, activeStart = null;
              for (let i = all.length - 1; i >= 0; i--) {
                if (all[i].contributionCount > 0) {
                  activeStreak++;
                  activeStart = all[i].date;
                } else if (i === all.length - 1) {
                  continue;
                } else {
                  break;
                }
              }
              const fmtShort = (iso) => iso ? new Date(iso + "T00:00:00Z").toLocaleDateString("en-US", { month: "short", day: "numeric", timeZone: "UTC" }) : "";
              const todayShort = fmtShort(all[all.length - 1].date);
              const currDateLabel = activeStreak > 0 ? `${fmtShort(activeStart)} – Present` : todayShort;
              const maxDateLabel = (maxStart && maxEnd) ? `${fmtShort(maxStart)} – ${fmtShort(maxEnd)}` : "Best Streak";

              // Calculate real 12-bucket sparkline path from chronological calendar days
              const numBuckets = 12;
              const bucketSize = Math.max(1, Math.floor(all.length / numBuckets));
              const bucketVals = [];
              for (let i = 0; i < numBuckets; i++) {
                const s = i * bucketSize;
                const e = i === numBuckets - 1 ? all.length : (i + 1) * bucketSize;
                let sum = 0;
                for (let j = s; j < e; j++) sum += all[j].contributionCount;
                bucketVals.push(sum);
              }
              const maxBucket = Math.max(1, ...bucketVals);
              const pts = bucketVals.map((val, i) => [
                Number(((i / (numBuckets - 1)) * 228).toFixed(1)),
                Number((33 - (val / maxBucket) * 28).toFixed(1))
              ]);
              let sparkStrokeD = `M ${pts[0][0]},${pts[0][1]}`;
              for (let i = 0; i < pts.length - 1; i++) {
                const [x0, y0] = pts[i];
                const [x1, y1] = pts[i + 1];
                const cx = Number(((x0 + x1) / 2).toFixed(1));
                sparkStrokeD += ` C ${cx},${y0} ${cx},${y1} ${x1},${y1}`;
              }
              const sparkFillD = `${sparkStrokeD} L 228,36 L 0,36 Z`;
              const lastY = pts[pts.length - 1][1];

              // Calculate real Top 6 Languages across all owned non-fork repositories
              const langMap = new Map();
              const defaultColors = {
                TypeScript: "#3178C6", JavaScript: "#F7DF1E", HTML: "#E34F26",
                Java: "#F59E0B", CSS: "#A855F7", Python: "#00D9FF",
                "C++": "#F34B7D", C: "#555555", Shell: "#89E051"
              };
              for (const repo of u.repositories.nodes) {
                for (const edge of (repo.languages?.edges || [])) {
                  const name = edge.node.name;
                  if (name === "RenderScript") continue;
                  const prev = langMap.get(name) || { size: 0, color: defaultColors[name] || edge.node.color || "#38BDF8" };
                  prev.size += edge.size;
                  langMap.set(name, prev);
                }
              }
              const sortedLangs = [...langMap.entries()]
                .sort((a, b) => b[1].size - a[1].size)
                .slice(0, 6);
              const totalLangSize = Math.max(1, sortedLangs.reduce((acc, [, v]) => acc + v.size, 0));

              let statsSvg = fs.readFileSync("github_stats.svg", "utf8");
              statsSvg = statsSvg
                .replace(/(<text id="rank-letter-val"[^>]*>)[^<]+(<\/text>)/, `$1${rankLetter}$2`)
                .replace(/(<text(?: id="commits-year-val")? x="0" y="0" class="hero-num" style="font-size: 28px;">)[^<]+(<\/text>)/, `$1${commitsYear.toLocaleString()}$2`)
                .replace(/(<text(?: id="all-time-val")? x="0" y="0" class="hero-num">)[^<]+(<\/text>)/, `$1${allTimeTotal.toLocaleString()}$2`)
                .replace(/(<text id="curr-streak-val"[^>]*>)[^<]+(<\/text>)/, `$1${activeStreak} DAYS$2`)
                .replace(/(<text id="curr-streak-date"[^>]*>)[^<]+(<\/text>)/, `$1${currDateLabel}$2`)
                .replace(/(<text id="max-streak-val"[^>]*>)[^<]+(<\/text>)/, `$1${maxStreak} DAYS$2`)
                .replace(/(<text id="max-streak-date"[^>]*>)[^<]+(<\/text>)/, `$1${maxDateLabel}$2`)
                .replace(/(Total Stars Earned<\/text>\s*<text[^>]*>)[^<]+(<\/text>)/, `$1${stars.toLocaleString()}$2`)
                .replace(/(Total Pull Requests<\/text>\s*<text[^>]*>)[^<]+(<\/text>)/, `$1${prs.toLocaleString()}$2`)
                .replace(/(Issues Reported<\/text>\s*<text[^>]*>)[^<]+(<\/text>)/, `$1${issues.toLocaleString()}$2`)
                .replace(/(Repos Contributed To<\/text>\s*<text[^>]*>)[^<]+(<\/text>)/, `$1${contributed.toLocaleString()}$2`)
                .replace(/(<path id="spark-fill-path" d=")[^"]+(")/, `$1${sparkFillD}$2`)
                .replace(/(<path id="spark-line-path" d=")[^"]+(")/, `$1${sparkStrokeD}$2`)
                .replace(/(<path id="spark-pulse-path"[^>]*d=")[^"]+(")/, `$1${sparkStrokeD}$2`)
                .replace(/(<circle id="spark-end-dot" cx="228" cy=")[^"]+(")/, `$1${lastY}$2`);

              // Update Top 6 Languages segments and rows
              let currX = 0;
              sortedLangs.forEach(([name, info], idx) => {
                const i = idx + 1;
                const pct = (info.size * 100) / totalLangSize;
                const pctStr = `${pct.toFixed(2)}%`;
                const col = defaultColors[name] || info.color || "#00D9FF";
                let segW = Number(((pct / 100) * 228).toFixed(1));
                if (idx === sortedLangs.length - 1) segW = Number(Math.max(2, 228 - currX).toFixed(1));
                if (segW < 2) segW = 2;
                const barW = Math.max(4, Number(((pct / 100) * 78).toFixed(1)));

                statsSvg = statsSvg
                  .replace(new RegExp(`(<rect id="lang-seg-${i}" x=")[^"]+(" y="0" width=")[^"]+(" height="8"[^>]*fill=")[^"]+(")`), `$1${Number(currX.toFixed(1))}$2${segW}$3${col}$4`)
                  .replace(new RegExp(`(<circle id="lang-dot-${i}"[^>]*fill=")[^"]+(")`), `$1${col}$2`)
                  .replace(new RegExp(`(<text id="lang-name-${i}"[^>]*>)[^<]+(<\\/text>)`), `$1${name}$2`)
                  .replace(new RegExp(`(<rect id="lang-bar-${i}" x="98" y="-6.5" width=")[^"]+(" height="5" rx="2.5" fill=")[^"]+(")`), `$1${barW}$2${col}$3`)
                  .replace(new RegExp(`(<text id="lang-pct-${i}"[^>]*>)[^<]+(<\\/text>)`), `$1${pctStr}$2`);
                currX += segW;
              });

              fs.writeFileSync("github_stats.svg", statsSvg);

              // Also fetch live Profile Views from komarev and update footer.svg
              const fetchKomarev = () => new Promise((resolve) => {
                https.get(`https://komarev.com/ghpvc/?username=${USER}`, (resp) => {
                  let body = "";
                  resp.on("data", (chunk) => body += chunk);
                  resp.on("end", () => {
                    const matches = [...body.matchAll(/>([0-9,]+)</g)].map((m) => m[1]);
                    resolve(matches.length ? matches[matches.length - 1] : null);
                  });
                }).on("error", () => resolve(null));
              });
              const liveViews = await fetchKomarev();
              if (liveViews && fs.existsSync("footer.svg")) {
                let footerSvg = fs.readFileSync("footer.svg", "utf8");
                footerSvg = footerSvg.replace(/(<text id="profile-views-val"[^>]*>)[^<]+(<\/text>)/, `$1${liveViews}$2`);
                fs.writeFileSync("footer.svg", footerSvg);
              }
            } catch (e) {
              console.log("Skipped live github_stats.svg / footer.svg update:", e.message);
            }

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install animation dependencies
        run: pip install pillow

      - name: Generate Apache Attack Skyline Animation
        run: python scripts/generate_animation.py

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add skyline.svg skyline.gif github_stats.svg footer.svg scripts/skyline_data.json
          git diff --cached --quiet || git commit -m "chore: update skyline, github stats, and profile views telemetry"
          git push
