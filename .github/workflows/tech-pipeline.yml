name: Generate Tech Pipeline Animation

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Generate animation
        uses: Platane/snk@v3
        with:
          github_user_name: gayathra45
          outputs: |
            dist/pipeline-animation.svg
            dist/pipeline-animation-dark.svg?palette=github-dark&color_snake=#00D9FF&color_dots=#1a1a1a,#2d2d2d,#404040,#525252,#656565
            
      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
