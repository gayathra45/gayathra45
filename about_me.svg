<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 315" width="540" height="315" role="img" aria-label="About Me - Gayathra Samuditha">
  <defs>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00D9FF" stop-opacity="0.75"/>
      <stop offset="50%" stop-color="#30363d" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#39D353" stop-opacity="0.65"/>
    </linearGradient>
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#161b22"/>
      <stop offset="100%" stop-color="#0d1117"/>
    </linearGradient>
    <linearGradient id="itemBg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1c2128"/>
      <stop offset="100%" stop-color="#13171e"/>
    </linearGradient>
    <linearGradient id="cyanBar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00D9FF"/>
      <stop offset="50%" stop-color="#39D353"/>
      <stop offset="100%" stop-color="#00D9FF"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <style>
    .title {
      font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif;
      font-weight: 700;
      font-size: 15.5px;
      fill: #f0f6fc;
      letter-spacing: 0.9px;
    }
    .term-path {
      font-family: 'Fira Code', 'Consolas', monospace;
      font-size: 11.5px;
      fill: #8b949e;
    }
    .label {
      font-family: 'Fira Code', 'Consolas', monospace;
      font-size: 9.8px;
      font-weight: 700;
      letter-spacing: 1.2px;
    }
    .value {
      font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif;
      font-size: 14.5px;
      font-weight: 600;
      fill: #e6edf3;
    }
    .highlight-cyan { fill: #00D9FF; font-weight: 700; }
    .highlight-green { fill: #39D353; font-weight: 700; }
    .highlight-blue { fill: #58a6ff; font-weight: 700; }
    .highlight-pink { fill: #ff7b72; font-weight: 700; }
    .pill-text {
      font-family: 'Fira Code', 'Consolas', monospace;
      font-size: 10px;
      font-weight: 600;
      fill: #00D9FF;
    }
    .cursor {
      fill: #00D9FF;
      animation: blink 1s step-end infinite;
    }
    .pulse-dot {
      fill: #39D353;
      animation: pulse 2s ease-in-out infinite;
    }
    .pulse-ring {
      stroke: #39D353;
      fill: none;
      transform-origin: 486px 25px;
      animation: ring 2s ease-out infinite;
    }
    .scan-line {
      animation: scan 3.5s ease-in-out infinite;
    }
    @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.45; } }
    @keyframes ring { 0% { r: 3.5px; opacity: 0.9; } 100% { r: 10px; opacity: 0; } }
    @keyframes scan { 0%, 100% { opacity: 0.4; } 50% { opacity: 1; } }
  </style>

  <!-- Main Glassmorphic Card Frame -->
  <rect x="2" y="2" width="536" height="311" rx="14" fill="url(#cardBg)" stroke="url(#borderGrad)" stroke-width="1.5"/>

  <!-- Top Terminal Window Header Bar -->
  <path d="M 3 16 Q 3 3 16 3 L 524 3 Q 537 3 537 16 L 537 46 L 3 46 Z" fill="#161b22"/>
  <line x1="3" y1="46" x2="537" y2="46" stroke="#30363d" stroke-width="1"/>
  <line class="scan-line" x1="16" y1="46" x2="240" y2="46" stroke="url(#cyanBar)" stroke-width="2"/>

  <!-- macOS / Terminal Window Dots -->
  <circle cx="22" cy="25" r="5.5" fill="#ff5f56"/>
  <circle cx="40" cy="25" r="5.5" fill="#ffbd2e"/>
  <circle cx="58" cy="25" r="5.5" fill="#27c93f"/>

  <!-- Header Title & Path -->
  <text x="80" y="30" class="title">ABOUT ME</text>
  <text x="174" y="29" class="term-path">~/gayathra45/about.sh</text>
  <rect x="322" y="18" width="7" height="13" class="cursor"/>

  <!-- Live Status Pill -->
  <rect x="472" y="14" width="52" height="22" rx="11" fill="#0d1117" stroke="#238636" stroke-width="1"/>
  <circle cx="486" cy="25" r="3.5" class="pulse-ring" stroke-width="1.2"/>
  <circle cx="486" cy="25" r="3.5" class="pulse-dot"/>
  <text x="495" y="29" font-family="'Fira Code', monospace" font-size="9.5" font-weight="700" fill="#39D353">LIVE</text>

  <!-- ================= ROW 1: CURRENTLY LEARNING (MERN STACK) ================= -->
  <g transform="translate(16, 58)">
    <rect x="0" y="0" width="508" height="54" rx="10" fill="url(#itemBg)" stroke="#21262d" stroke-width="1"/>
    <rect x="0" y="8" width="3.5" height="38" rx="1.75" fill="#00D9FF" filter="url(#glow)"/>
    <rect x="14" y="9" width="36" height="36" rx="8" fill="#0d1117" stroke="#00D9FF" stroke-opacity="0.45" stroke-width="1"/>
    <!-- Code / Stack Vector Icon -->
    <path d="M 27 22 L 22 27 L 27 32 M 37 22 L 42 27 L 37 32 M 34 20 L 30 34" fill="none" stroke="#00D9FF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="62" y="20" class="label" fill="#00D9FF">CURRENTLY LEARNING</text>
    <text x="62" y="40" class="value">I'm currently learning <tspan class="highlight-cyan">MERN Stack</tspan></text>
  </g>

  <!-- ================= ROW 2: EDUCATION (KDU) ================= -->
  <g transform="translate(16, 120)">
    <rect x="0" y="0" width="508" height="54" rx="10" fill="url(#itemBg)" stroke="#21262d" stroke-width="1"/>
    <rect x="0" y="8" width="3.5" height="38" rx="1.75" fill="#39D353" filter="url(#glow)"/>
    <rect x="14" y="9" width="36" height="36" rx="8" fill="#0d1117" stroke="#39D353" stroke-opacity="0.45" stroke-width="1"/>
    <!-- Graduation Cap Vector Icon -->
    <path d="M 32 19 L 21 24.5 L 32 30 L 43 24.5 Z M 25 27.5 V 33.5 C 25 35.5 39 35.5 39 33.5 V 27.5" fill="none" stroke="#39D353" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="62" y="20" class="label" fill="#39D353">EDUCATION &amp; UNIVERSITY</text>
    <text x="62" y="40" class="value">I'm an <tspan class="highlight-green">Undergraduate at KDU</tspan></text>
    <rect x="412" y="16" width="84" height="22" rx="6" fill="#0d1117" stroke="#39D353" stroke-opacity="0.35"/>
    <text x="454" y="31" font-family="'Fira Code', monospace" font-size="10" font-weight="600" fill="#39D353" text-anchor="middle">BSc IT · LK</text>
  </g>

  <!-- ================= ROW 3: HOW TO REACH ME ================= -->
  <g transform="translate(16, 182)">
    <rect x="0" y="0" width="508" height="54" rx="10" fill="url(#itemBg)" stroke="#21262d" stroke-width="1"/>
    <rect x="0" y="8" width="3.5" height="38" rx="1.75" fill="#58a6ff" filter="url(#glow)"/>
    <rect x="14" y="9" width="36" height="36" rx="8" fill="#0d1117" stroke="#58a6ff" stroke-opacity="0.45" stroke-width="1"/>
    <!-- Mail Vector Icon -->
    <rect x="22" y="20" width="20" height="14" rx="2.5" fill="none" stroke="#58a6ff" stroke-width="1.8"/>
    <path d="M 23 21.5 L 32 28 L 41 21.5" fill="none" stroke="#58a6ff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="62" y="20" class="label" fill="#58a6ff">HOW TO REACH ME</text>
    <text x="62" y="40" class="value" font-size="13.5">gayathrasamuditha45<tspan class="highlight-blue">@gmail.com</tspan></text>
    <rect x="412" y="16" width="84" height="22" rx="6" fill="#0d1117" stroke="#58a6ff" stroke-opacity="0.35"/>
    <text x="454" y="31" font-family="'Fira Code', monospace" font-size="10" font-weight="600" fill="#58a6ff" text-anchor="middle">Direct Mail</text>
  </g>

  <!-- ================= ROW 4: FUN FACT ================= -->
  <g transform="translate(16, 244)">
    <rect x="0" y="0" width="508" height="54" rx="10" fill="url(#itemBg)" stroke="#21262d" stroke-width="1"/>
    <rect x="0" y="8" width="3.5" height="38" rx="1.75" fill="#ff7b72" filter="url(#glow)"/>
    <rect x="14" y="9" width="36" height="36" rx="8" fill="#0d1117" stroke="#ff7b72" stroke-opacity="0.45" stroke-width="1"/>
    <!-- Lightning Bolt Vector Icon -->
    <polygon points="34,18 25,28 31,28 29,36 39,26 33,26" fill="none" stroke="#ff7b72" stroke-width="1.8" stroke-linejoin="round"/>
    <text x="62" y="20" class="label" fill="#ff7b72">FUN FACT &amp; ALIAS</text>
    <text x="62" y="40" class="value">Call me as <tspan class="highlight-pink">Gayya</tspan></text>
    <rect x="412" y="16" width="84" height="22" rx="6" fill="#0d1117" stroke="#ff7b72" stroke-opacity="0.35"/>
    <text x="454" y="31" font-family="'Fira Code', monospace" font-size="10" font-weight="600" fill="#ff7b72" text-anchor="middle">@gayathra45</text>
  </g>
</svg>
