<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 158 48" width="158" height="48" role="img" aria-label="FACEBOOK - CONNECT">
  <defs>
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#181F2C" />
      <stop offset="100%" stop-color="#0D1117" />
    </linearGradient>
    <linearGradient id="cardBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1877F2" stop-opacity="0.65" />
      <stop offset="50%" stop-color="#1E293B" stop-opacity="0.7" />
      <stop offset="100%" stop-color="#60A5FA" stop-opacity="0.45" />
    </linearGradient>
    <linearGradient id="topCatch" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1877F2" stop-opacity="0" />
      <stop offset="50%" stop-color="#1877F2" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#60A5FA" stop-opacity="0" />
    </linearGradient>
    <radialGradient id="iconGlow" cx="50%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#1877F2" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#1877F2" stop-opacity="0" />
    </radialGradient>
    
  </defs>
  <style>
    .btn-title {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', Roboto, sans-serif;
      font-size: 11.5px;
      font-weight: 800;
      letter-spacing: 0.8px;
      fill: #F8FAFC;
    }
    .btn-sub {
      font-family: 'JetBrains Mono', 'Fira Code', Consolas, monospace;
      font-size: 8px;
      font-weight: 600;
      letter-spacing: 0.6px;
      fill: #94A3B8;
    }
  </style>

  <!-- Outer Dark-Glass Button Base -->
  <rect x="1" y="1" width="156" height="46" rx="11" fill="url(#cardBg)" stroke="url(#cardBorder)" stroke-width="1.2" />
  <rect x="2.2" y="2.2" width="153.6" height="43.6" rx="9.8" fill="none" stroke="#FFFFFF" stroke-opacity="0.04" stroke-width="0.8" />

  <!-- Top Specular Catchlight -->
  <line x1="18" y1="1.2" x2="140" y2="1.2" stroke="url(#topCatch)" stroke-width="1.6" stroke-linecap="round" />

  <!-- Left Icon Ambient Glow + Squircle Pod -->
  <circle cx="25" cy="24" r="18" fill="url(#iconGlow)" />
  <rect x="9" y="8" width="32" height="32" rx="8" fill="#111621" stroke="#263143" stroke-width="0.9" />

  <!-- Official Vector Brand Icon -->
  
  <g transform="translate(14, 13)">
    <rect x="0" y="0" width="22" height="22" rx="5" fill="#1877F2" />
    <path fill="#FFFFFF" d="M15.1 14.2L15.6 11H12.5V8.9C12.5 8.0 12.9 7.2 14.3 7.2H15.7V4.5C15.7 4.5 14.4 4.3 13.2 4.3C10.7 4.3 9.0 5.8 9.0 8.6V11H6.2V14.2H9.0V22H12.5V14.2H15.1Z" />
  </g>


  <!-- Button Typography -->
  <text x="50" y="21.5" class="btn-title">FACEBOOK</text>
  <text x="50" y="34" class="btn-sub">CONNECT</text>

  <!-- Top-Right External Link Arrow (↗) -->
  <g transform="translate(138, 17)" stroke="#1877F2" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.85">
    <line x1="0" y1="7" x2="7" y2="0" />
    <polyline points="2,0 7,0 7,5" />
  </g>
</svg>
