<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 36" width="100%" height="100%" role="img" aria-label="Connect With Me Section Header">
  <defs>
    <filter id="cyanGlow" x="-25%" y="-40%" width="150%" height="180%">
      <feGaussianBlur stdDeviation="2.2" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  <style>
    .sec-eyebrow {
      font-family: 'JetBrains Mono', 'Fira Code', 'SFMono-Regular', Consolas, monospace;
      font-size: 9.5px;
      font-weight: 700;
      letter-spacing: 2.8px;
      fill: #849CB2;
    }
    .pill-lbl {
      font-family: 'JetBrains Mono', 'Fira Code', Consolas, monospace;
      font-size: 7.5px;
      font-weight: 700;
      letter-spacing: 1.4px;
      fill: #CBD5E1;
    }
    .cyan { fill: #00D9FF; }
  </style>

  <g transform="translate(4, 22)">
    <circle cx="6" cy="-3.5" r="2.8" fill="#00D9FF" filter="url(#cyanGlow)">
      <animate attributeName="opacity" values="0.4;1;0.4" dur="2s" repeatCount="indefinite" />
    </circle>
    <circle cx="6" cy="-3.5" r="2.8" fill="none" stroke="#00D9FF" stroke-width="0.9">
      <animate attributeName="r" values="2.8;8" dur="2s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.7;0" dur="2s" repeatCount="indefinite" />
    </circle>
    <text x="18" y="0" class="sec-eyebrow">NETWORK.LINKS <tspan class="cyan">//</tspan> CONNECT WITH ME</text>

    <!-- Subtle Connecting Divider Line -->
    <line x1="295" y1="-3.5" x2="718" y2="-3.5" stroke="#1E293B" stroke-width="1" />

    <!-- Right Status Pill -->
    <g transform="translate(728, -12)">
      <rect x="0" y="0" width="106" height="17" rx="8.5" fill="#11161F" stroke="#1E293B" stroke-width="1" />
      <circle cx="11" cy="8.5" r="2.2" fill="#10B981">
        <animate attributeName="opacity" values="0.35;1;0.35" dur="1.6s" repeatCount="indefinite" />
      </circle>
      <text x="19" y="11.5" class="pill-lbl">OPEN TO COLLAB</text>
    </g>
  </g>
</svg>
