<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 114" width="100%" height="100%" role="img" aria-label="Footer and Profile Views Telemetry - Gayathra Samuditha">
  <defs>
    <!-- Main Dark Frosted Glass Card Background -->
    <linearGradient id="dockBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#161C26" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#0D1117" stop-opacity="0.98" />
    </linearGradient>

    <!-- Recessed Inner Pod Gradient -->
    <linearGradient id="podBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0B0E14" />
      <stop offset="100%" stop-color="#111621" />
    </linearGradient>

    <!-- Profile Views Pod Gradient with Subtle Cyan Tint -->
    <linearGradient id="viewsPodBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#111A27" />
      <stop offset="100%" stop-color="#0B1018" />
    </linearGradient>

    <!-- Outer Card Border Gradient -->
    <linearGradient id="dockBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155" stop-opacity="0.85" />
      <stop offset="50%" stop-color="#1E293B" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#00D9FF" stop-opacity="0.45" />
    </linearGradient>

    <!-- Top Specular Catchlight -->
    <linearGradient id="topCatchlight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00D9FF" stop-opacity="0" />
      <stop offset="25%" stop-color="#38BDF8" stop-opacity="0.45" />
      <stop offset="50%" stop-color="#00D9FF" stop-opacity="0.8" />
      <stop offset="75%" stop-color="#38BDF8" stop-opacity="0.45" />
      <stop offset="100%" stop-color="#00D9FF" stop-opacity="0" />
    </linearGradient>

    <!-- Bottom Divider Line Fade -->
    <linearGradient id="divFadeL" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1E293B" stop-opacity="0" />
      <stop offset="100%" stop-color="#334155" stop-opacity="0.8" />
    </linearGradient>
    <linearGradient id="divFadeR" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#334155" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#1E293B" stop-opacity="0" />
    </linearGradient>

    <filter id="cyanGlow" x="-25%" y="-40%" width="150%" height="180%">
      <feGaussianBlur stdDeviation="2.0" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    .dev-name {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', Roboto, sans-serif;
      font-size: 13px;
      font-weight: 800;
      letter-spacing: 0.8px;
      fill: #F8FAFC;
    }
    .dev-handle {
      font-family: 'JetBrains Mono', 'Fira Code', Consolas, monospace;
      font-size: 8.5px;
      font-weight: 600;
      letter-spacing: 1.2px;
      fill: #94A3B8;
    }
    .term-prompt {
      font-family: 'JetBrains Mono', 'Fira Code', Consolas, monospace;
      font-size: 12px;
      font-weight: 800;
      fill: #00D9FF;
    }
    .term-msg {
      font-family: 'JetBrains Mono', 'Fira Code', Consolas, monospace;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.4px;
      fill: #E2E8F0;
    }
    .views-lbl {
      font-family: 'JetBrains Mono', 'Fira Code', Consolas, monospace;
      font-size: 7.5px;
      font-weight: 700;
      letter-spacing: 1.5px;
      fill: #94A3B8;
    }
    .views-val {
      font-family: 'JetBrains Mono', 'Fira Code', Consolas, monospace;
      font-size: 17px;
      font-weight: 800;
      letter-spacing: 0.6px;
      fill: #00D9FF;
    }
    .live-tag {
      font-family: 'JetBrains Mono', 'Fira Code', Consolas, monospace;
      font-size: 7px;
      font-weight: 700;
      letter-spacing: 0.8px;
      fill: #10B981;
    }
    .copy-bar {
      font-family: 'JetBrains Mono', 'Fira Code', Consolas, monospace;
      font-size: 9px;
      font-weight: 600;
      letter-spacing: 2px;
      fill: #64748B;
      text-anchor: middle;
    }
    .white-bold {
      fill: #CBD5E1;
      font-weight: 700;
    }
    .cyan {
      fill: #00D9FF;
    }

    /* Smooth 3-Message Terminal Rotator */
    .msg-1, .msg-2, .msg-3 {
      opacity: 0;
    }
    .msg-1 { animation: rotMsg1 12s ease-in-out infinite; }
    .msg-2 { animation: rotMsg2 12s ease-in-out infinite; }
    .msg-3 { animation: rotMsg3 12s ease-in-out infinite; }

    @keyframes rotMsg1 {
      0%, 3% { opacity: 0; transform: translateY(3px); }
      7%, 29% { opacity: 1; transform: translateY(0); }
      33%, 100% { opacity: 0; transform: translateY(-3px); }
    }
    @keyframes rotMsg2 {
      0%, 33% { opacity: 0; transform: translateY(3px); }
      37%, 62% { opacity: 1; transform: translateY(0); }
      66%, 100% { opacity: 0; transform: translateY(-3px); }
    }
    @keyframes rotMsg3 {
      0%, 66% { opacity: 0; transform: translateY(3px); }
      70%, 95% { opacity: 1; transform: translateY(0); }
      99%, 100% { opacity: 0; transform: translateY(-3px); }
    }
  </style>

  <!-- ==================== MAIN DARK-GLASS BENTO FOOTER DOCK (x=2, y=6, w=836, h=70) ==================== -->
  <g transform="translate(2, 6)">
    <!-- Outer Frosted Glass Shell -->
    <rect x="0" y="0" width="836" height="70" rx="14" fill="url(#dockBg)" stroke="url(#dockBorder)" stroke-width="1.2" />
    <rect x="1.5" y="1.5" width="833" height="67" rx="12.5" fill="none" stroke="#FFFFFF" stroke-opacity="0.03" stroke-width="0.8" />

    <!-- Top Specular Catchlight -->
    <line x1="60" y1="0.8" x2="776" y2="0.8" stroke="url(#topCatchlight)" stroke-width="1.5" />

    <!-- ==================== 1. LEFT MODULE: DEVELOPER IDENTITY & STATUS (x=14, y=13) ==================== -->
    <g transform="translate(14, 13)">
      <!-- Squircle Code Emblem Pod -->
      <rect x="0" y="0" width="44" height="44" rx="10" fill="url(#podBg)" stroke="#263143" stroke-width="1" />
      <!-- Vector Code Brackets </> -->
      <g transform="translate(22, 22)" fill="none" stroke="#00D9FF" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="-6,-5 -11,0 -6,5" />
        <polyline points="6,-5 11,0 6,5" />
        <line x1="2.5" y1="-7" x2="-2.5" y2="7" stroke="#38BDF8" stroke-width="1.5" />
      </g>
      <!-- Online Status Dot on Corner of Pod -->
      <circle cx="39" cy="5" r="4.5" fill="#0D1117" />
      <circle cx="39" cy="5" r="2.8" fill="#10B981">
        <animate attributeName="opacity" values="0.45;1;0.45" dur="1.8s" repeatCount="indefinite" />
      </circle>

      <!-- Developer Name & Handle -->
      <text x="56" y="19" class="dev-name">GAYATHRA SAMUDITHA</text>
      <text x="56" y="34" class="dev-handle"><tspan class="cyan">@GAYATHRA45</tspan> · WORKSPACE</text>
    </g>

    <!-- Vertical Subtle Divider 1 -->
    <line x1="258" y1="14" x2="258" y2="56" stroke="#1E293B" stroke-width="1" />

    <!-- ==================== 2. CENTER MODULE: INTERACTIVE TERMINAL STATUS DISPLAY (x=272, y=13, w=322, h=44) ==================== -->
    <g transform="translate(272, 13)">
      <rect x="0" y="0" width="322" height="44" rx="10" fill="url(#podBg)" stroke="#1E293B" stroke-width="1" />
      <!-- Left Terminal Traffic Mini-Dots -->
      <circle cx="14" cy="11" r="2.2" fill="#EF4444" opacity="0.8" />
      <circle cx="22" cy="11" r="2.2" fill="#F59E0B" opacity="0.8" />
      <circle cx="30" cy="11" r="2.2" fill="#10B981" opacity="0.8" />
      <text x="42" y="13.5" class="views-lbl" style="font-size: 6.8px; fill: #475569;">bash // status.sh</text>

      <!-- Terminal Prompt Symbol -->
      <text x="14" y="33" class="term-prompt">&gt;</text>

      <!-- Animated Rotating Terminal Messages -->
      <g class="msg-1">
        <text x="28" y="33" class="term-msg">Let's build something amazing! <tspan class="cyan">_</tspan></text>
      </g>
      <g class="msg-2">
        <text x="28" y="33" class="term-msg">Thanks for visiting my profile! <tspan class="cyan">_</tspan></text>
      </g>
      <g class="msg-3">
        <text x="28" y="33" class="term-msg">Feel free to explore my repos! <tspan class="cyan">_</tspan></text>
      </g>
    </g>

    <!-- Vertical Subtle Divider 2 -->
    <line x1="608" y1="14" x2="608" y2="56" stroke="#1E293B" stroke-width="1" />

    <!-- ==================== 3. RIGHT MODULE: REDESIGNED "PROFILE VIEWS" TELEMETRY CARD (x=622, y=11, w=200, h=48) ==================== -->
    <g transform="translate(622, 11)">
      <rect x="0" y="0" width="200" height="48" rx="11" fill="url(#viewsPodBg)" stroke="#00D9FF" stroke-opacity="0.45" stroke-width="1.1" />
      <!-- Top Cyan Specular Highlight on Views Card -->
      <line x1="20" y1="0.6" x2="180" y2="0.6" stroke="#00D9FF" stroke-opacity="0.7" stroke-width="1.2" />

      <!-- Left Eye / Radar Telemetry Icon Box -->
      <rect x="8" y="8" width="32" height="32" rx="8" fill="#0B0F17" stroke="#1E293B" stroke-width="0.9" />
      <!-- Vector Cyber Eye Icon -->
      <g transform="translate(24, 24)" fill="none" stroke="#00D9FF" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
        <path d="M -9,0 C -5.5,-5.5 5.5,-5.5 9,0 C 5.5,5.5 -5.5,5.5 -9,0 Z" />
        <circle cx="0" cy="0" r="2.6" fill="#00D9FF" filter="url(#cyanGlow)">
          <animate attributeName="r" values="2.0;3.0;2.0" dur="2s" repeatCount="indefinite" />
        </circle>
      </g>

      <!-- Profile Views Label + Live Counter -->
      <text x="48" y="18" class="views-lbl">PROFILE VIEWS</text>
      <text id="profile-views-val" x="48" y="37" class="views-val" filter="url(#cyanGlow)">1,154</text>

      <!-- Right Mini Animated Telemetry Bars + LIVE Pill -->
      <g transform="translate(154, 10)">
        <rect x="0" y="0" width="36" height="13" rx="6.5" fill="#0D1F1C" stroke="#10B981" stroke-opacity="0.5" stroke-width="0.8" />
        <circle cx="8" cy="6.5" r="2" fill="#10B981">
          <animate attributeName="opacity" values="0.3;1;0.3" dur="1.4s" repeatCount="indefinite" />
        </circle>
        <text x="13" y="9" class="live-tag">LIVE</text>
      </g>

      <!-- Animated Equalizer Telemetry Bars (Bottom Right of Views Pod) -->
      <g transform="translate(158, 37)" fill="#00D9FF" opacity="0.85">
        <rect x="0" y="-6" width="3" height="6" rx="1">
          <animate attributeName="height" values="4;10;4" dur="1.2s" repeatCount="indefinite" />
          <animate attributeName="y" values="-4;-10;-4" dur="1.2s" repeatCount="indefinite" />
        </rect>
        <rect x="6" y="-10" width="3" height="10" rx="1" fill="#38BDF8">
          <animate attributeName="height" values="10;5;10" dur="1.5s" repeatCount="indefinite" />
          <animate attributeName="y" values="-10;-5;-10" dur="1.5s" repeatCount="indefinite" />
        </rect>
        <rect x="12" y="-7" width="3" height="7" rx="1">
          <animate attributeName="height" values="5;11;5" dur="1.1s" repeatCount="indefinite" />
          <animate attributeName="y" values="-5;-11;-5" dur="1.1s" repeatCount="indefinite" />
        </rect>
        <rect x="18" y="-9" width="3" height="9" rx="1" fill="#38BDF8">
          <animate attributeName="height" values="9;4;9" dur="1.4s" repeatCount="indefinite" />
          <animate attributeName="y" values="-9;-4;-9" dur="1.4s" repeatCount="indefinite" />
        </rect>
        <rect x="24" y="-5" width="3" height="5" rx="1">
          <animate attributeName="height" values="4;9;4" dur="1.3s" repeatCount="indefinite" />
          <animate attributeName="y" values="-4;-9;-4" dur="1.3s" repeatCount="indefinite" />
        </rect>
      </g>
    </g>
  </g>

  <!-- ==================== BOTTOM ARCHITECTURAL COPYRIGHT BAR (y=98) ==================== -->
  <line x1="40" y1="96" x2="215" y2="96" stroke="url(#divFadeL)" stroke-width="1" />
  <circle cx="223" cy="96" r="2" fill="#00D9FF" opacity="0.7" />

  <text x="420" y="99.5" class="copy-bar">
    © 2026 <tspan class="white-bold">GAYATHRA SAMUDITHA</tspan> <tspan class="cyan">·</tspan> CRAFTED WITH CLEAN CODE
  </text>

  <circle cx="617" cy="96" r="2" fill="#00D9FF" opacity="0.7" />
  <line x1="625" y1="96" x2="800" y2="96" stroke="url(#divFadeR)" stroke-width="1" />
</svg>
