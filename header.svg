<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 148" width="100%" height="100%" role="img" aria-label="Minimalist Modern Technological Hero Section">
  <defs>
    <!-- Soft Atmospheric Horizon Bloom (100% Transparent Outer Canvas) -->
    <radialGradient id="horizonGlow" cx="50%" cy="82%" r="44%">
      <stop offset="0%" stop-color="#00D9FF" stop-opacity="0.18" />
      <stop offset="45%" stop-color="#38BDF8" stop-opacity="0.06" />
      <stop offset="100%" stop-color="#0D1117" stop-opacity="0" />
    </radialGradient>

    <!-- Ultra-Clean Metallic White Headline Gradient -->
    <linearGradient id="cleanTitle" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="65%" stop-color="#F1F5F9" />
      <stop offset="100%" stop-color="#94A3B8" />
    </linearGradient>

    <!-- Faded Curved Horizon Line Gradient -->
    <linearGradient id="arcLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00D9FF" stop-opacity="0" />
      <stop offset="25%" stop-color="#38BDF8" stop-opacity="0.35" />
      <stop offset="50%" stop-color="#00D9FF" stop-opacity="0.85" />
      <stop offset="75%" stop-color="#38BDF8" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#00D9FF" stop-opacity="0" />
    </linearGradient>

    <filter id="softBloom" x="-20%" y="-40%" width="140%" height="180%">
      <feGaussianBlur stdDeviation="2.2" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    .top-pill {
      font-family: 'JetBrains Mono', 'Fira Code', 'SFMono-Regular', Consolas, monospace;
      font-size: 9px;
      font-weight: 600;
      letter-spacing: 3.5px;
      fill: #849CB2;
      text-anchor: middle;
    }
    .main-title {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', Roboto, Helvetica, Arial, sans-serif;
      font-size: 28px;
      font-weight: 800;
      letter-spacing: 6.5px;
      fill: url(#cleanTitle);
      text-anchor: middle;
    }
    .sub-line {
      font-family: 'JetBrains Mono', 'Fira Code', 'SFMono-Regular', Consolas, monospace;
      font-size: 9.5px;
      font-weight: 600;
      letter-spacing: 3.2px;
      fill: #64748B;
      text-anchor: middle;
    }
    .accent {
      fill: #00D9FF;
    }
    .light {
      fill: #CBD5E1;
    }

    /* Smooth Gliding Light Pulse Along the Curved Horizon Arc */
    .arc-pulse {
      stroke-dasharray: 70 600;
      animation: glideArc 5s ease-in-out infinite alternate;
    }
    @keyframes glideArc {
      from { stroke-dashoffset: 310; }
      to { stroke-dashoffset: -240; }
    }
  </style>

  <!-- 1. Minimalist Atmospheric Horizon Glow -->
  <ellipse cx="420" cy="118" rx="310" ry="44" fill="url(#horizonGlow)">
    <animate attributeName="rx" values="280;340;280" dur="6s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="0.7;1;0.7" dur="4s" repeatCount="indefinite" />
  </ellipse>

  <!-- Subtle Floating Micro-Stars in Open Space -->
  <circle cx="235" cy="36" r="1.2" fill="#00D9FF">
    <animate attributeName="opacity" values="0.15;0.75;0.15" dur="3.8s" repeatCount="indefinite" />
  </circle>
  <circle cx="605" cy="42" r="1.2" fill="#38BDF8">
    <animate attributeName="opacity" values="0.2;0.7;0.2" dur="4.4s" repeatCount="indefinite" />
  </circle>
  <circle cx="420" cy="16" r="1" fill="#CBD5E1">
    <animate attributeName="opacity" values="0.1;0.55;0.1" dur="3.2s" repeatCount="indefinite" />
  </circle>

  <!-- 2. Minimalist Top Status Indicator -->
  <g transform="translate(420, 34)">
    <circle cx="-106" cy="-3" r="2.4" fill="#00D9FF" filter="url(#softBloom)">
      <animate attributeName="opacity" values="0.4;1;0.4" dur="2s" repeatCount="indefinite" />
    </circle>
    <text x="6" y="0" class="top-pill">BSc IT UNDERGRADUATE</text>
  </g>

  <!-- 3. Clean Bold Centered Headline -->
  <g transform="translate(420, 74)">
    <text x="0" y="0" class="main-title">FULL-STACK DEVELOPER</text>
  </g>

  <!-- 4. Minimalist Three-Pillar Subtitle -->
  <g transform="translate(420, 102)">
    <text x="0" y="0" class="sub-line">
      <tspan class="light">WEB APPS</tspan>
      <tspan class="accent">  ·  </tspan>
      <tspan class="light">GAME DEV</tspan>
      <tspan class="accent">  ·  </tspan>
      <tspan class="light">LEGO BUILDER</tspan>
    </text>
  </g>

  <!-- 5. Signature Curved Technological Horizon Arc -->
  <path d="M 130,134 Q 420,108 710,134" fill="none" stroke="url(#arcLine)" stroke-width="1.3" stroke-linecap="round" />
  <path class="arc-pulse" d="M 130,134 Q 420,108 710,134" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" filter="url(#softBloom)" />
</svg>
