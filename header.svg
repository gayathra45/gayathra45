<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 142" width="100%" height="100%" role="img" aria-label="Minimalist Modern Developer Hero Section">
  <defs>
    <!-- Soft Atmospheric Horizon Bloom (100% Transparent Outer Canvas) -->
    <radialGradient id="horizonGlow" cx="50%" cy="82%" r="44%">
      <stop offset="0%" stop-color="#00D9FF" stop-opacity="0.18" />
      <stop offset="45%" stop-color="#38BDF8" stop-opacity="0.06" />
      <stop offset="100%" stop-color="#0D1117" stop-opacity="0" />
    </radialGradient>

    <!-- Ultra-Clean Metallic White Headline Gradient -->
    <linearGradient id="cleanTitle" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="65%" stop-color="#F1F5F9" />
      <stop offset="100%" stop-color="#94A3B8" />
    </linearGradient>

    <!-- Faded Curved Horizon Line Gradient -->
    <linearGradient id="arcLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00D9FF" stop-opacity="0" />
      <stop offset="25%" stop-color="#38BDF8" stop-opacity="0.35" />
      <stop offset="50%" stop-color="#00D9FF" stop-opacity="0.85" />
      <stop offset="75%" stop-color="#38BDF8" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#00D9FF" stop-opacity="0" />
    </linearGradient>

    <filter id="softBloom" x="-20%" y="-40%" width="140%" height="180%">
      <feGaussianBlur stdDeviation="2.2" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    .top-pill {
      font-family: 'JetBrains Mono', 'Fira Code', 'SFMono-Regular', Consolas, monospace;
      font-size: 9px;
      font-weight: 600;
      letter-spacing: 3.4px;
      fill: #849CB2;
      text-anchor: middle;
    }
    .main-title {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', Roboto, Helvetica, Arial, sans-serif;
      font-size: 28px;
      font-weight: 800;
      letter-spacing: 6.5px;
      fill: url(#cleanTitle);
      text-anchor: middle;
    }
    .sub-line {
      font-family: 'JetBrains Mono', 'Fira Code', 'SFMono-Regular', Consolas, monospace;
      font-size: 9.5px;
      font-weight: 600;
      letter-spacing: 3px;
      fill: #64748B;
      text-anchor: middle;
    }
    .accent {
      fill: #00D9FF;
    }
    .light {
      fill: #CBD5E1;
    }

    /* Changing Main Titles Kinetic Crossfade Animation (3 Roles, 12s Cycle) */
    .role-1, .role-2, .role-3 {
      opacity: 0;
    }
    .role-1 { animation: roleCycle 12s infinite cubic-bezier(0.4, 0, 0.2, 1); }
    .role-2 { animation: roleCycle 12s infinite cubic-bezier(0.4, 0, 0.2, 1) 4s; }
    .role-3 { animation: roleCycle 12s infinite cubic-bezier(0.4, 0, 0.2, 1) 8s; }
    @keyframes roleCycle {
      0%, 4% { opacity: 0; transform: translateY(7px); }
      10%, 28% { opacity: 1; transform: translateY(0px); }
      34%, 100% { opacity: 0; transform: translateY(-7px); }
    }

    /* Live Mini Telemetry Equalizer Bars */
    .eq-bar {
      fill: #00D9FF;
      transform-box: fill-box;
      transform-origin: bottom;
      animation: eqPulse 1.8s ease-in-out infinite;
    }
    .eq-bar.slate { fill: #849CB2; }
    @keyframes eqPulse {
      0%, 100% { transform: scaleY(0.35); opacity: 0.45; }
      50% { transform: scaleY(1); opacity: 1; }
    }

    /* Smooth Gliding Light Pulse Along the Curved Horizon Arc */
    .arc-pulse {
      stroke-dasharray: 70 600;
      animation: glideArc 5s ease-in-out infinite alternate;
    }
    @keyframes glideArc {
      from { stroke-dashoffset: 310; }
      to { stroke-dashoffset: -240; }
    }
  </style>

  <!-- 1. Minimalist Atmospheric Horizon Glow -->
  <ellipse cx="420" cy="114" rx="310" ry="44" fill="url(#horizonGlow)">
    <animate attributeName="rx" values="280;340;280" dur="6s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="0.7;1;0.7" dur="4s" repeatCount="indefinite" />
  </ellipse>

  <!-- Subtle Floating Micro-Stars in Open Space -->
  <circle cx="215" cy="34" r="1.2" fill="#00D9FF">
    <animate attributeName="cy" values="38;28;38" dur="4s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="0.15;0.75;0.15" dur="4s" repeatCount="indefinite" />
  </circle>
  <circle cx="625" cy="38" r="1.2" fill="#38BDF8">
    <animate attributeName="cy" values="42;32;42" dur="4.4s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="0.2;0.7;0.2" dur="4.4s" repeatCount="indefinite" />
  </circle>
  <circle cx="155" cy="92" r="1.1" fill="#CBD5E1">
    <animate attributeName="opacity" values="0.1;0.55;0.1" dur="3.4s" repeatCount="indefinite" />
  </circle>
  <circle cx="685" cy="90" r="1.1" fill="#00D9FF">
    <animate attributeName="opacity" values="0.15;0.65;0.15" dur="3.8s" repeatCount="indefinite" />
  </circle>

  <!-- 2. Top Technological Status Header -->
  <g transform="translate(420, 32)">
    <!-- Pulsing Live Status Beacon -->
    <circle cx="-164" cy="-3" r="2.5" fill="#00D9FF" filter="url(#softBloom)">
      <animate attributeName="opacity" values="0.4;1;0.4" dur="2s" repeatCount="indefinite" />
    </circle>
    <circle cx="-164" cy="-3" r="2.5" fill="none" stroke="#00D9FF" stroke-width="0.9">
      <animate attributeName="r" values="2.5;7.5" dur="2s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.7;0" dur="2s" repeatCount="indefinite" />
    </circle>

    <text x="0" y="0" class="top-pill">DEV.WORKSPACE <tspan class="accent">//</tspan> CREATIVE CODING</text>

    <!-- Minimalist 4-Bar Live Equalizer -->
    <g transform="translate(162, -9)">
      <rect class="eq-bar slate" x="0" y="2" width="1.8" height="8" rx="0.9" style="animation-delay: 0.1s" />
      <rect class="eq-bar" x="4" y="0" width="1.8" height="10" rx="0.9" style="animation-delay: 0.3s" />
      <rect class="eq-bar slate" x="8" y="3" width="1.8" height="7" rx="0.9" style="animation-delay: 0.5s" />
      <rect class="eq-bar" x="12" y="1" width="1.8" height="9" rx="0.9" style="animation-delay: 0.2s" />
    </g>
  </g>

  <!-- 3. Changing Main Headline Animation -->
  <g transform="translate(420, 74)">
    <g class="role-1">
      <text x="0" y="0" class="main-title">FULL-STACK DEVELOPER</text>
    </g>
    <g class="role-2">
      <text x="0" y="0" class="main-title">IT UNDERGRADUATE</text>
    </g>
    <g class="role-3">
      <text x="0" y="0" class="main-title">CREATIVE BUILDER</text>
    </g>
  </g>

  <!-- 4. Simple & Funny Developer Subtitle -->
  <g transform="translate(420, 102)">
    <text x="0" y="0" class="sub-line">
      <tspan class="light">TURNING COFFEE INTO CODE</tspan>
      <tspan class="accent">  ·  </tspan>
      <tspan class="light">DEBUGGING AT 3 AM</tspan>
    </text>
  </g>

  <!-- 5. Signature Curved Technological Horizon Arc -->
  <path d="M 130,132 Q 420,106 710,132" fill="none" stroke="url(#arcLine)" stroke-width="1.3" stroke-linecap="round" />
  <path class="arc-pulse" d="M 130,132 Q 420,106 710,132" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" filter="url(#softBloom)" />
</svg>
