<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 142" width="100%" height="100%" role="img" aria-label="Technologies and Tools Left-to-Right Scrolling Marquee">
  <defs>
    <!-- Smooth Left & Right Edge Fade Mask for Seamless Marquee Entry/Exit -->
    <linearGradient id="edgeFadeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#000000" stop-opacity="0" />
      <stop offset="10%" stop-color="#FFFFFF" stop-opacity="1" />
      <stop offset="90%" stop-color="#FFFFFF" stop-opacity="1" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </linearGradient>
    <mask id="marqueeMask">
      <rect x="0" y="0" width="840" height="142" fill="url(#edgeFadeGrad)" />
    </mask>

    <!-- Subtle Horizontal Rail Gradient -->
    <linearGradient id="railLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00D9FF" stop-opacity="0" />
      <stop offset="20%" stop-color="#1E293B" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#00D9FF" stop-opacity="0.45" />
      <stop offset="80%" stop-color="#1E293B" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#00D9FF" stop-opacity="0" />
    </linearGradient>

    <!-- Dark Glass App-Icon Squircle Background -->
    <linearGradient id="iconGlass" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E2533" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#0F141C" stop-opacity="0.98" />
    </linearGradient>

    <filter id="softGlow" x="-20%" y="-40%" width="140%" height="180%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- ==================== 14 HIGH-PRECISION TECH LOGO CARDS (86px Pitch, Total Width = 1204px) ==================== -->
    <g id="logo-strip">
      <!-- 1. HTML5 (x=0) -->
      <g transform="translate(0, 0)">
        <rect x="0" y="0" width="62" height="62" rx="15" fill="url(#iconGlass)" stroke="#E34F26" stroke-opacity="0.45" stroke-width="1.2" />
        <polygon points="17,13 45,13 42.5,41 31,45 19.5,41" fill="#E34F26" />
        <polygon points="31,15.5 42.5,15.5 40.3,39 31,42.2" fill="#EF652A" />
        <polyline points="38,21 23,21 24,28 37,28 36,36 31,37.5 26,36 25.5,33" fill="none" stroke="#FFFFFF" stroke-width="3.2" stroke-linecap="square" />
        <text x="31" y="79" class="logo-lbl">HTML5</text>
      </g>

      <!-- 2. CSS3 (x=86) -->
      <g transform="translate(86, 0)">
        <rect x="0" y="0" width="62" height="62" rx="15" fill="url(#iconGlass)" stroke="#264DE4" stroke-opacity="0.45" stroke-width="1.2" />
        <polygon points="17,13 45,13 42.5,41 31,45 19.5,41" fill="#1572B6" />
        <polygon points="31,15.5 42.5,15.5 40.3,39 31,42.2" fill="#33A9DC" />
        <polyline points="23,21 38,21 37,28 25,28" fill="none" stroke="#FFFFFF" stroke-width="3.2" stroke-linecap="square" />
        <polyline points="37,28 36,36 31,37.5 26,36 25.5,33" fill="none" stroke="#FFFFFF" stroke-width="3.2" stroke-linecap="square" />
        <text x="31" y="79" class="logo-lbl">CSS3</text>
      </g>

      <!-- 3. JavaScript (x=172) -->
      <g transform="translate(172, 0)">
        <rect x="0" y="0" width="62" height="62" rx="15" fill="url(#iconGlass)" stroke="#F7DF1E" stroke-opacity="0.45" stroke-width="1.2" />
        <rect x="13" y="13" width="36" height="36" rx="7" fill="#F7DF1E" />
        <text x="31" y="42" class="badge-heavy" fill="#11151C">JS</text>
        <text x="31" y="79" class="logo-lbl">JAVASCRIPT</text>
      </g>

      <!-- 4. TypeScript (x=258) -->
      <g transform="translate(258, 0)">
        <rect x="0" y="0" width="62" height="62" rx="15" fill="url(#iconGlass)" stroke="#3178C6" stroke-opacity="0.5" stroke-width="1.2" />
        <rect x="13" y="13" width="36" height="36" rx="7" fill="#3178C6" />
        <text x="31" y="42" class="badge-heavy" fill="#FFFFFF">TS</text>
        <text x="31" y="79" class="logo-lbl">TYPESCRIPT</text>
      </g>

      <!-- 5. React (x=344) -->
      <g transform="translate(344, 0)">
        <rect x="0" y="0" width="62" height="62" rx="15" fill="url(#iconGlass)" stroke="#61DAFB" stroke-opacity="0.5" stroke-width="1.2" />
        <g transform="translate(31, 31)">
          <ellipse cx="0" cy="0" rx="17" ry="6.5" fill="none" stroke="#61DAFB" stroke-width="2" />
          <ellipse cx="0" cy="0" rx="17" ry="6.5" fill="none" stroke="#61DAFB" stroke-width="2" transform="rotate(60)" />
          <ellipse cx="0" cy="0" rx="17" ry="6.5" fill="none" stroke="#61DAFB" stroke-width="2" transform="rotate(120)" />
          <circle cx="0" cy="0" r="3.4" fill="#61DAFB" />
        </g>
        <text x="31" y="79" class="logo-lbl">REACT</text>
      </g>

      <!-- 6. Node.js (x=430) -->
      <g transform="translate(430, 0)">
        <rect x="0" y="0" width="62" height="62" rx="15" fill="url(#iconGlass)" stroke="#539E43" stroke-opacity="0.5" stroke-width="1.2" />
        <polygon points="31,12 47,21.5 47,40.5 31,50 15,40.5 15,21.5" fill="#1E2D24" stroke="#68A063" stroke-width="2.2" stroke-linejoin="round" />
        <text x="31" y="36" class="badge-heavy" style="font-size: 14px;" fill="#68A063">JS</text>
        <text x="31" y="79" class="logo-lbl">NODE.JS</text>
      </g>

      <!-- 7. Python (x=516) -->
      <g transform="translate(516, 0)">
        <rect x="0" y="0" width="62" height="62" rx="15" fill="url(#iconGlass)" stroke="#3776AB" stroke-opacity="0.5" stroke-width="1.2" />
        <path d="M 30,14 C 21,14 21,18 21,22 L 21,25 L 31,25 L 31,27 L 18,27 C 14,27 13,31 14,37 C 15,41 18,41 21,41 L 24,41 L 24,36 C 24,33 27,31 31,31 L 39,31 C 42,31 44,29 44,26 L 44,21 C 44,16 40,14 30,14 Z" fill="#3776AB" />
        <path d="M 32,48 C 41,48 41,44 41,40 L 41,37 L 31,37 L 31,35 L 44,35 C 48,35 49,31 48,25 C 47,21 44,21 41,21 L 38,21 L 38,26 C 38,29 35,31 31,31 L 23,31 C 20,31 18,33 18,36 L 18,41 C 18,46 22,48 32,48 Z" fill="#FFD43B" />
        <circle cx="25" cy="18.5" r="1.5" fill="#FFFFFF" />
        <circle cx="37" cy="43.5" r="1.5" fill="#1E293B" />
        <text x="31" y="79" class="logo-lbl">PYTHON</text>
      </g>

      <!-- 8. Java (x=602) -->
      <g transform="translate(602, 0)">
        <rect x="0" y="0" width="62" height="62" rx="15" fill="url(#iconGlass)" stroke="#F89820" stroke-opacity="0.45" stroke-width="1.2" />
        <!-- Steam Waves -->
        <path d="M 27,26 C 24,22 30,18 27,13" fill="none" stroke="#E76F00" stroke-width="2.2" stroke-linecap="round" />
        <path d="M 34,26 C 31,22 37,18 34,13" fill="none" stroke="#E76F00" stroke-width="2.2" stroke-linecap="round" />
        <!-- Cup & Saucer Arcs -->
        <path d="M 19,31 L 40,31 C 40,39 36,43 29.5,43 C 23,43 19,39 19,31 Z" fill="none" stroke="#5382A1" stroke-width="2.4" stroke-linejoin="round" />
        <path d="M 40,33 L 44,33 C 46.5,33 46.5,38.5 44,38.5 L 39,38.5" fill="none" stroke="#5382A1" stroke-width="2.2" />
        <path d="M 16,47 Q 31,50 46,47" fill="none" stroke="#E76F00" stroke-width="2.2" stroke-linecap="round" />
        <text x="31" y="79" class="logo-lbl">JAVA</text>
      </g>

      <!-- 9. C++ (x=688) -->
      <g transform="translate(688, 0)">
        <rect x="0" y="0" width="62" height="62" rx="15" fill="url(#iconGlass)" stroke="#00599C" stroke-opacity="0.55" stroke-width="1.2" />
        <polygon points="31,12 47,21.5 47,40.5 31,50 15,40.5 15,21.5" fill="#00599C" />
        <text x="31" y="36.5" class="badge-heavy" style="font-size: 13.5px;" fill="#FFFFFF">C++</text>
        <text x="31" y="79" class="logo-lbl">C++</text>
      </g>

      <!-- 10. C Language (x=774) -->
      <g transform="translate(774, 0)">
        <rect x="0" y="0" width="62" height="62" rx="15" fill="url(#iconGlass)" stroke="#5C6BC0" stroke-opacity="0.55" stroke-width="1.2" />
        <polygon points="31,12 47,21.5 47,40.5 31,50 15,40.5 15,21.5" fill="#3949AB" />
        <text x="31" y="37.5" class="badge-heavy" style="font-size: 18px;" fill="#FFFFFF">C</text>
        <text x="31" y="79" class="logo-lbl">C LANG</text>
      </g>

      <!-- 11. Git (x=860) -->
      <g transform="translate(860, 0)">
        <rect x="0" y="0" width="62" height="62" rx="15" fill="url(#iconGlass)" stroke="#F05032" stroke-opacity="0.5" stroke-width="1.2" />
        <rect x="17" y="17" width="28" height="28" rx="5" fill="#F05032" transform="rotate(45 31 31)" />
        <line x1="24" y1="24" x2="36" y2="36" stroke="#FFFFFF" stroke-width="2.4" />
        <line x1="31" y1="22" x2="31" y2="38" stroke="#FFFFFF" stroke-width="2.4" />
        <circle cx="31" cy="22" r="2.8" fill="#FFFFFF" />
        <circle cx="31" cy="38" r="2.8" fill="#FFFFFF" />
        <circle cx="37" cy="31" r="2.8" fill="#FFFFFF" />
        <text x="31" y="79" class="logo-lbl">GIT</text>
      </g>

      <!-- 12. MySQL (x=946) -->
      <g transform="translate(946, 0)">
        <rect x="0" y="0" width="62" height="62" rx="15" fill="url(#iconGlass)" stroke="#00758F" stroke-opacity="0.55" stroke-width="1.2" />
        <g transform="translate(31, 31)" fill="none" stroke="#00A4EF" stroke-width="2">
          <ellipse cx="0" cy="-10" rx="13" ry="5" fill="#102536" />
          <path d="M -13,-10 L -13,10 C -13,13 13,13 13,10 L 13,-10" />
          <path d="M -13,-3 C -13,0 13,0 13,-3" />
          <path d="M -13,4 C -13,7 13,7 13,4" stroke="#F29111" />
        </g>
        <text x="31" y="79" class="logo-lbl">MYSQL</text>
      </g>

      <!-- 13. MongoDB (x=1032) -->
      <g transform="translate(1032, 0)">
        <rect x="0" y="0" width="62" height="62" rx="15" fill="url(#iconGlass)" stroke="#47A248" stroke-opacity="0.5" stroke-width="1.2" />
        <path d="M 31,13 C 40,21 41,34 31,47 C 21,34 22,21 31,13 Z" fill="#1B3322" stroke="#47A248" stroke-width="2.2" />
        <line x1="31" y1="17" x2="31" y2="50" stroke="#86EFAC" stroke-width="1.6" />
        <text x="31" y="79" class="logo-lbl">MONGODB</text>
      </g>

      <!-- 14. VS Code (x=1118) -->
      <g transform="translate(1118, 0)">
        <rect x="0" y="0" width="62" height="62" rx="15" fill="url(#iconGlass)" stroke="#007ACC" stroke-opacity="0.55" stroke-width="1.2" />
        <g transform="translate(15, 15)">
          <polygon points="24,2 31,5.5 31,26.5 24,30 5,15" fill="#007ACC" />
          <polyline points="3,9 24,26 24,6 3,23" fill="none" stroke="#38BDF8" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" />
        </g>
        <text x="31" y="79" class="logo-lbl">VS CODE</text>
      </g>
    </g>
  </defs>

  <style>
    .sec-title {
      font-family: 'JetBrains Mono', 'Fira Code', 'SFMono-Regular', Consolas, monospace;
      font-size: 9.5px;
      font-weight: 700;
      letter-spacing: 3.4px;
      fill: #849CB2;
      text-anchor: middle;
    }
    .logo-lbl {
      font-family: 'JetBrains Mono', 'Fira Code', Consolas, monospace;
      font-size: 8px;
      font-weight: 700;
      letter-spacing: 1.2px;
      fill: #94A3B8;
      text-anchor: middle;
    }
    .badge-heavy {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif;
      font-size: 16px;
      font-weight: 900;
      text-anchor: middle;
    }
    .cyan { fill: #00D9FF; }

    /* Seamless Left-to-Right Infinite Marquee Animation (1204px exact repeat period) */
    .marquee-ltr {
      animation: scrollLeftToRight 22s linear infinite;
    }
    @keyframes scrollLeftToRight {
      from { transform: translateX(-1204px); }
      to { transform: translateX(0px); }
    }
  </style>

  <!-- 1. Minimalist Centered Section Header -->
  <g transform="translate(420, 20)">
    <circle cx="-132" cy="-3.2" r="2.5" fill="#00D9FF" filter="url(#softGlow)">
      <animate attributeName="opacity" values="0.4;1;0.4" dur="2s" repeatCount="indefinite" />
    </circle>
    <text x="0" y="0" class="sec-title">TECHNOLOGIES <tspan class="cyan">&amp;</tspan> TOOLS</text>
  </g>

  <line x1="80" y1="33" x2="760" y2="33" stroke="url(#railLine)" stroke-width="1" />

  <!-- 2. Masked Infinite Left-to-Right Scrolling Logo Track -->
  <g mask="url(#marqueeMask)">
    <g transform="translate(0, 44)">
      <g class="marquee-ltr">
        <use href="#logo-strip" x="0" y="0" />
        <use href="#logo-strip" x="1204" y="0" />
      </g>
    </g>
  </g>

  <line x1="140" y1="136" x2="700" y2="136" stroke="url(#railLine)" stroke-width="1" opacity="0.65" />
</svg>

